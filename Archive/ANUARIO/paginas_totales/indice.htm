function MM_timelinePlay(tmLnName, myID) { //v1.2

    for (i=0; i<tmLn.length; i++) {

                while (keyFrm<numKeyFr && fNew>=sprite.keyFrames[keyFrm]) keyFrm++;

  } }
}
